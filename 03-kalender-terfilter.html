<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlubKita - Kalender Terfilter</title>
</head>
<body>
    <header>
        <nav aria-label="Navigasi utama">
            <a href="01-beranda.html">KlubKita</a>
            <a href="01-beranda.html">Beranda</a>
            <a href="02-kalender-event.html">Kalender</a>
            <a href="01-beranda.html">Tentang</a>
        </nav>
    </header>

    <main>
        <p><a href="01-beranda.html">Kembali ke Beranda</a></p>

        <section aria-labelledby="judul-filter">
            <h1 id="judul-filter">Kalender / Daftar Kegiatan</h1>

            <aside>
                <h2>Filter</h2>
                <form action="03-kalender-terfilter.html" method="get">
                    <fieldset>
                        <legend>Filter kegiatan</legend>

                        <p>
                            <label for="olahraga">Olahraga</label>
                            <select id="olahraga" name="olahraga">
                                <option value="futsal" selected>Futsal</option>
                                <option value="badminton">Badminton</option>
                                <option value="basket">Basket</option>
                                <option value="jogging">Jogging</option>
                            </select>
                        </p>

                        <p>
                            <label for="hari">Hari</label>
                            <input type="text" id="hari" name="hari" value="Sabtu, 26 September">
                        </p>

                        <p>
                            <label for="lokasi">Lokasi</label>
                            <input type="text" id="lokasi" name="lokasi" value="Lapangan Tifosi Sport Center">
                        </p>

                        <button type="submit">Terapkan</button>
                        <button type="reset">Reset</button>
                    </fieldset>
                </form>
            </aside>

            <section aria-labelledby="hasil-filter">
                <h2 id="hasil-filter">Hasil Filter</h2>
                <p>Filter aktif: Futsal</p>

                <article>
                    <img src="./assets/images/futsal.webp" alt="Kegiatan futsal">
                    <h3>Sabtu, 26 September</h3>
                    <h4>Futsal Mingguan</h4>
                    <p>16.00 - 18.00 WIB - Lapangan Tifosi Sport Center</p>
                    <p><a href="04-detail-event.html">Lihat Detail</a></p>
                </article>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KlubKita</p>
    </footer>
</body>
</html>
