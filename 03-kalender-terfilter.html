<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlubKita - Kalender Terfilter</title>

    <!-- Integrasi CSS dan JavaScript Modul 7 -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/format.js" defer></script>
    <script src="js/ui-state.js" defer></script>
    <script src="js/interaksi.js" defer></script>
    <script src="js/navbar.js" defer></script>
</head>

<body>
    <header>
        <nav aria-label="Navigasi utama">
            <a href="01-beranda.html">KlubKita</a>
            <a href="01-beranda.html">Beranda</a>
            <a href="02-kalender-event.html" aria-current="page">Kalender</a>
            <a href="11-tentang.html">Tentang</a>
        </nav>
    </header>

    <main>
        <p><a href="01-beranda.html">Kembali ke Beranda</a></p>

        <section aria-labelledby="judul-filter">
            <h1 id="judul-filter">Kalender / Daftar Kegiatan</h1>

            <aside>
                <h2>Filter</h2>

                <form id="form-filter" action="03-kalender-terfilter.html" method="get">
                    <fieldset>
                        <legend>Filter kegiatan</legend>

                        <p>
                            <label for="cari">Cari kegiatan</label>
                            <input type="search" id="cari" name="q" placeholder="Cari judul atau lokasi...">
                        </p>

                        <p>
                            <label for="olahraga">Olahraga</label>
                            <select id="olahraga" name="olahraga">
                                <option value="">Semua</option>
                                <option value="futsal">Futsal</option>
                                <option value="badminton">Badminton</option>
                                <option value="basket">Basket</option>
                                <option value="jogging">Jogging</option>
                                <option value="voli">Voli</option>
                            </select>
                        </p>

                        <p>
                            <label for="hari">Hari</label>
                            <select id="hari" name="hari">
                                <option value="">Semua</option>
                                <option value="senin">Senin</option>
                                <option value="selasa">Selasa</option>
                                <option value="rabu">Rabu</option>
                                <option value="kamis">Kamis</option>
                                <option value="jumat">Jumat</option>
                                <option value="sabtu">Sabtu</option>
                                <option value="minggu">Minggu</option>
                            </select>
                        </p>

                        <p>
                            <label for="lokasi">Lokasi</label>
                            <input type="text" id="lokasi" name="lokasi" placeholder="Semua">
                        </p>

                        <button type="submit">Terapkan</button>
                        <button type="reset">Reset</button>
                    </fieldset>
                </form>
            </aside>

            <section id="daftar-event-container" aria-labelledby="hasil-filter">
                <h2 id="hasil-filter">Hasil Filter</h2>
                <p id="filter-aktif">Menampilkan semua kegiatan</p>
                <p id="status-event" role="status"></p>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KlubKita</p>
    </footer>
</body>

</html>
